{% extends "base.html" %}

{% block title %}
Добавить оборудование
{% endblock %}

{% block content %}

<h2>Новое оборудование</h2>

{% for error in errors|default([]) %}
    <p>{{ error }}</p>
{% endfor %}

<form method="POST">

    <p>
        <label>Название</label>
        <input type="text" name="title" value="{{ title|default('') }}">
    </p>

    <p>
        <label>Категория</label>
        <input type="text" name="category" value="{{ category|default('') }}">
    </p>

    <p>
        <label>Бренд</label>
        <input type="text" name="brand" value="{{ brand|default('') }}">
    </p>

    <p>
        <label>Цена</label>
        <input type="number" name="price" value="{{ price|default('') }}" step="0.01">
    </p>

    <p>
        <label>Описание</label>
        <textarea name="description">{{ description|default('') }}</textarea>
    </p>

    <button type="submit">Сохранить</button>

</form>

{% endblock %}
